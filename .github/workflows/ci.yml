name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Syntax check
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f"
          done
      - run: npm test