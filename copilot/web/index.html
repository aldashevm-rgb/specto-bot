<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Copilot — кодинг-ассистент</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #2f81f7; --green: #3fb950; --red: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; }
  header b { font-size: 15px; }
  header .meta { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  header button { background: transparent; color: var(--dim); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  header button:hover { color: var(--text); border-color: var(--dim); }
  .toggle { color: var(--dim); font-size: 12px; display: flex; align-items: center;
    gap: 5px; cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; width: 100%;
    margin: 0 auto; }
  .msg { margin-bottom: 18px; }
  .role { font-size: 12px; color: var(--dim); margin-bottom: 6px; text-transform: uppercase;
    letter-spacing: .5px; }
  .user .bubble { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; white-space: pre-wrap; }
  .bubble { line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .thinking { color: var(--dim); font-style: italic; font-size: 13px;
    border-left: 2px solid var(--border); padding-left: 10px; margin: 6px 0; white-space: pre-wrap; }
  .tool { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 11px; margin: 6px 0; display: flex; gap: 8px; align-items: center; }
  .tool .name { color: var(--accent); }
  .tool .arg { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .ok { color: var(--green); } .tool .fail { color: var(--red); }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 13px; }
  code { font-family: ui-monospace, Menlo, monospace; }
  footer { border-top: 1px solid var(--border); padding: 14px; }
  .inputwrap { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px;
    font-family: inherit; line-height: 1.4; max-height: 160px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .send { background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 0 20px; font-size: 14px; cursor: pointer; }
  .send:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--dim); font-size: 11px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <b>⚡ Copilot</b>
    <span class="meta" id="meta">…</span>
    <span class="spacer"></span>
    <label class="toggle" id="strongWrap" title="Выполнить запрос через сильную модель (Claude)">
      <input type="checkbox" id="strong" /> 🧠 умнее
    </label>
    <button id="reset">Новый чат</button>
  </header>
  <div id="chat"></div>
  <footer>
    <div class="inputwrap">
      <textarea id="input" rows="1" placeholder="Опиши задачу по коду… (Enter — отправить, Shift+Enter — перенос)"></textarea>
      <button class="send" id="send">Отправить</button>
    </div>
    <div class="hint">Ассистент читает и правит файлы, ищет по проекту, запускает команды.</div>
  </footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
let sessionId = localStorage.getItem("copilot_sid") || null;
let busy = false;

fetch("/api/info").then(r => r.json()).then(d => {
  document.getElementById("meta").textContent = d.main;
  document.getElementById("strongWrap").title = "Выполнить запрос через: " + d.strong;
});

function el(cls, parent) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  (parent || chat).appendChild(d);
  return d;
}
function scroll() { chat.scrollTop = chat.scrollHeight; }

function addUser(text) {
  const m = el("msg user");
  el("role", m).textContent = "вы";
  el("bubble", m).textContent = text;
  scroll();
}

const ICON = { read_file:"📖", write_file:"✍️", edit_file:"✏️", list_files:"📂", search:"🔎", run_bash:"⚙️", remember:"🧠", forget:"🗑️", generate_image:"🎨", web_search:"🌐", fetch_url:"🔗" };

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);
document.getElementById("reset").addEventListener("click", async () => {
  if (sessionId) await fetch("/api/reset", { method: "POST", headers: {"content-type":"application/json"},
    body: JSON.stringify({ sessionId }) });
  chat.innerHTML = ""; sessionId = null; localStorage.removeItem("copilot_sid");
});

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  addUser(text);
  input.value = ""; input.style.height = "auto";

  const m = el("msg assistant");
  el("role", m).textContent = "copilot";
  let bubble = null, think = null;

  const strong = document.getElementById("strong").checked;
  const res = await fetch("/api/chat", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ sessionId, message: text, strong }),
  });
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) !== -1) {
      const line = buf.slice(0, idx); buf = buf.slice(idx + 2);
      if (!line.startsWith("data:")) continue;
      let evt; try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
      handle(evt);
    }
  }

  function handle(evt) {
    if (evt.type === "session") {
      sessionId = evt.sessionId; localStorage.setItem("copilot_sid", sessionId);
    } else if (evt.type === "thinking") {
      if (!think) think = el("thinking", m);
      think.textContent += evt.text; scroll();
    } else if (evt.type === "text") {
      think = null;
      if (!bubble) bubble = el("bubble", m);
      bubble.textContent += evt.text; scroll();
    } else if (evt.type === "tool_result") {
      think = null; bubble = null;
      const t = el("tool", m);
      const arg = evt.input?.path || evt.input?.pattern || evt.input?.query || evt.input?.command || "";
      t.innerHTML = `<span>${ICON[evt.name]||"🔧"}</span>` +
        `<span class="name">${evt.name}</span>` +
        `<span class="arg">${escapeHtml(String(arg))}</span>` +
        `<span class="${evt.ok?'ok':'fail'}">${evt.ok?'✓':'✗'}</span>`;
      // Сгенерированную картинку показываем прямо в чате.
      if (evt.name === "generate_image" && evt.ok) {
        const rel = String(evt.preview||"").match(/generated\/[^\s]+\.(?:jpg|jpeg|png|webp)/i);
        if (rel) {
          const wrap = el("", m);
          wrap.innerHTML = `<img src="/${rel[0]}" style="max-width:100%;border-radius:10px;margin:8px 0;border:1px solid var(--border)">`;
        }
      }
      scroll();
    } else if (evt.type === "error") {
      el("bubble", m).textContent = "⚠️ " + evt.message;
    }
  }

  busy = false; sendBtn.disabled = false; input.focus();
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
</script>
</body>
</html>
